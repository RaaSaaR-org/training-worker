[project]
name = "neodem-training-worker"
version = "0.1.0"
description = "NeoDEM training worker — polls the server for training jobs, runs SmolVLA LoRA fine-tuning, POSTs progress callbacks"
requires-python = ">=3.12"
dependencies = [
    # HTTP + polling
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    # Storage (S3-compatible RustFS)
    "boto3>=1.34.0",
    # NATS JetStream (for stats worker)
    "nats-py>=2.7.0",
    # Parquet reading (for stats worker)
    "pyarrow>=15.0.0",
    # ML stack (used by the real trainer in stage 1b)
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "datasets>=2.20.0",
    "numpy>=1.26.0",
    "huggingface-hub>=0.23.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# Real SmolVLA LoRA trainer (Phase 1b). LeRobot is on PyPI since v0.6.0;
# the base package is lightweight — policy/dataset deps live behind extras.
real-trainer = [
    "lerobot[smolvla,dataset]>=0.6.0",
]
# Native in-process GR00T N1.7 trainer (GR00T_BACKEND=lerobot, TASK-179).
# The Isaac-GR00T subprocess backend (default) needs NO extra Python deps —
# it shells out to a local clone with its own uv env (scripts/setup-gr00t.sh).
groot = [
    "lerobot[groot,dataset]>=0.6.0",
]
# Reward-model evaluation jobs (kind=reward_model): Robometer + TOPReward.
rewards = [
    "lerobot[robometer,topreward,dataset]>=0.6.0",
]
# Dataset annotation jobs (kind=annotate): lerobot-annotate VLM pipeline.
annotate = [
    "lerobot[annotations,dataset]>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
neodem-worker = "worker:main"
neodem-stats-worker = "stats_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainers", "eval"]
include = ["worker.py", "stats_worker.py", "callbacks.py", "storage.py", "config.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
